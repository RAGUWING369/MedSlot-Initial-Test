<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440" />
  <title>[SCR-015] Doctor Profile & Settings — Loading</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { min-width: 1280px; }
    .ann { position: absolute; display: block; border: 1.5px dashed #f59e0b; background: #fef3c7; color: #92400e; font-size: 0.7rem; padding: 2px 8px; border-radius: 3px; font-family: monospace; line-height: 1.6; white-space: nowrap; z-index: 50; pointer-events: none; }
    @keyframes shimmer { 0%{background-position:-700px 0} 100%{background-position:700px 0} }
    .skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 700px 100%; animation: shimmer 1.4s infinite; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 font-sans" style="min-width:1280px">
  <!--
    SCREEN  : SCR-015 Doctor Profile & Settings
    STATE   : State 2 — Loading (skeleton while profile data fetches)
    ROUTE   : /doctor/settings
    FILE    : docs/visuals/ux/SCR-015-doctor-profile-settings/state-2-loading.html
  -->

  <!-- Wireframe Label Bar -->

      <span style="font-weight:800;font-size:1rem">SCR-015 Doctor Profile & Settings</span>
      <span style="background:#64748b;color:white;font-size:0.7rem;font-weight:700;padding:2px 10px;border-radius:3px;text-transform:uppercase">State 2 — Loading</span>
      <span style="color:#93c5fd;font-size:0.8rem">Route: /doctor/settings</span>
    </div>
    <span style="color:#64748b;font-size:0.72rem">MedSlot · Phase 5 Wireframe · Desktop 1440px</span>
  </div>

  <!-- Top Navigation -->
  <nav style="background:#0B6E4F;color:white;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:60px">
    <div style="display:flex;align-items:center;gap:32px">
      <span style="font-weight:900;font-size:1.25rem;letter-spacing:-0.02em">Med<span style="color:#18A97A">Slot</span></span>
      <div style="display:flex;gap:4px">
        <a href="#" style="color:#a7f3d0;font-size:0.875rem;padding:6px 14px;border-radius:4px;text-decoration:none">Dashboard</a>
        <a href="#" style="color:#a7f3d0;font-size:0.875rem;padding:6px 14px;border-radius:4px;text-decoration:none">Appointments</a>
        <a href="#" style="color:#a7f3d0;font-size:0.875rem;padding:6px 14px;border-radius:4px;text-decoration:none">Availability</a>
        <a href="#" style="background:rgba(255,255,255,0.15);color:white;font-size:0.875rem;padding:6px 14px;border-radius:4px;text-decoration:none;font-weight:600">Profile & Settings</a>
      </div>
    </div>
    <div style="width:36px;height:36px;border-radius:50%;background:#18A97A;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.875rem">AM</div>
  </nav>

  <main style="max-width:1100px;margin:0 auto;padding:32px 24px">
    <div style="margin-bottom:28px">
      <div class="skeleton" style="width:220px;height:28px;margin-bottom:8px"></div>
      <div class="skeleton" style="width:380px;height:16px"></div>
    </div>

    <div style="display:grid;grid-template-columns:240px 1fr;gap:24px">
      <!-- Sidebar skeleton -->
      <div style="background:white;border-radius:10px;border:1px solid #e2e8f0;padding:20px;position:relative">
        <div class="ann" style="top:-28px;left:0">→ Sidebar skeleton while profile loads</div>
        <div class="skeleton" style="width:64px;height:64px;border-radius:50%;margin:0 auto 12px"></div>
        <div class="skeleton" style="width:140px;height:16px;margin:0 auto 6px"></div>
        <div class="skeleton" style="width:90px;height:12px;margin:0 auto 16px"></div>

        <div class="skeleton" style="height:36px;border-radius:6px;margin-bottom:6px"></div>
        <div class="skeleton" style="height:36px;border-radius:6px"></div>

      <div style="display:flex;flex-direction:column;gap:20px">
        <div style="background:white;border-radius:10px;border:1px solid #e2e8f0;padding:28px;position:relative">

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div><div class="skeleton" style="height:12px;width:80px;margin-bottom:6px"></div><div class="skeleton" style="height:18px;width:160px"></div></div>
            <div><div class="skeleton" style="height:12px;width:60px;margin-bottom:6px"></div><div class="skeleton" style="height:18px;width:120px"></div></div>
            <div><div class="skeleton" style="height:12px;width:100px;margin-bottom:6px"></div><div class="skeleton" style="height:18px;width:140px"></div></div>
            <div><div class="skeleton" style="height:12px;width:80px;margin-bottom:6px"></div><div class="skeleton" style="height:18px;width:180px"></div></div>
            <div><div class="skeleton" style="height:12px;width:130px;margin-bottom:6px"></div><div class="skeleton" style="height:18px;width:150px"></div></div>
            <div><div class="skeleton" style="height:12px;width:80px;margin-bottom:6px"></div><div class="skeleton" style="height:18px;width:80px"></div></div>
            <div style="grid-column:1/-1"><div class="skeleton" style="height:12px;width:90px;margin-bottom:6px"></div><div class="skeleton" style="height:60px;width:100%"></div></div>
          </div>
        </div>
        <div style="background:white;border-radius:10px;border:1px solid #e2e8f0;padding:28px">
          <div class="skeleton" style="width:160px;height:20px;margin-bottom:20px"></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div><div class="skeleton" style="height:12px;width:80px;margin-bottom:6px"></div><div class="skeleton" style="height:18px"></div></div>
            <div><div class="skeleton" style="height:12px;width:60px;margin-bottom:6px"></div><div class="skeleton" style="height:18px"></div></div>
            <div style="grid-column:1/-1"><div class="skeleton" style="height:12px;width:90px;margin-bottom:6px"></div><div class="skeleton" style="height:18px"></div></div>
          </div>
        </div>
      </div>
    </div>
  </main>

</html>
