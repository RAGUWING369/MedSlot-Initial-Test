[isort]
profile = black
line_length = 88
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
known_django = django
known_third_party = rest_framework,rest_framework_simplejwt,drf_spectacular,django_redis,celery,decouple
known_first_party = accounts,appointments,prescriptions,records,notifications,subscriptions,analytics,audit
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER

[flake8]
max-line-length = 88
extend-ignore = E203, W503, E501
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    migrations,
    .eggs,
    *.egg
per-file-ignores =
    # Allow wildcard imports in settings files (from .base import *)
    medslot/settings/*.py: F401, F403, F811
